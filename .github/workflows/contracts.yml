name: Publish contracts

# Releases PdfBuilder.Contracts as a NuGet package of the same name.
# Push a tag to release:   git tag contracts-v1.2.0 && git push origin contracts-v1.2.0
# The version comes from the tag, so the package and the git history cannot disagree.
on:
  push:
    tags: ['contracts-v*']

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      # Trusted Publishing: the job proves who it is to nuget.org with a GitHub OIDC token.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#contracts-v}" >> "$GITHUB_OUTPUT"

      # Only the contracts project: packing the solution would build the whole service for nothing.
      - name: Pack
        run: >
          dotnet pack src/PdfBuilder.Contracts/PdfBuilder.Contracts.csproj
          --configuration Release
          --output artifacts
          -p:Version=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      # No stored API key: nuget.org checks the OIDC token against the Trusted Publishing policy
      # for this repository and workflow file, and hands back a key that expires within the hour.
      # NUGET_USER is the nuget.org profile name (not the email) that owns that policy.
      - name: Sign in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # The matching .snupkg next to each package is pushed to the symbol server automatically.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }}
          --skip-duplicate
