# Local stack:  docker compose up --build
# Web app:      http://localhost:4200
# API:          http://localhost:8080/scalar/v1
# RabbitMQ UI:  http://localhost:15672  (guest / guest)

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Jobs and authored templates live here, so they survive `docker compose down` (but not
  # `down -v`). The credentials are for this local stack only; see deploy/ for real ones.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdf_builder
      POSTGRES_USER: pdf_builder
      POSTGRES_PASSWORD: pdf_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdf_builder -d pdf_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/PdfBuilder.Api/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
      ConnectionStrings__Database: Host=postgres;Database=pdf_builder;Username=pdf_builder;Password=pdf_builder
      Storage__PublicBaseUrl: http://localhost:8080
    volumes:
      - pdf-data:/data
      # Edit a template on the host and the next render picks it up, no rebuild needed.
      - ./templates:/app/Templates:ro

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080

volumes:
  pdf-data:
  postgres-data:
