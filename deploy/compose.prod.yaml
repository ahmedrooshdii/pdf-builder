# Runs on the Oracle Cloud VM at /opt/pdf-builder/compose.yaml.
# CI copies this file across and starts it; see deploy/README.md for the one-time setup.
#
# Unlike the root compose.yaml this runs no broker of its own - a free Always Free VM has better
# uses for its memory than a RabbitMQ nobody else talks to, and CloudAMQP is already provisioned.

services:
  # Jobs and authored templates live here, so this volume is the thing to back up
  # (`docker compose exec postgres pg_dump -U pdf_builder pdf_builder`). It is not published on any
  # port: only the API, on this compose network, can reach it.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdf_builder
      POSTGRES_USER: pdf_builder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdf_builder -d pdf_builder"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    # CI pins this to the exact digest it just built. The default is only for manual runs.
    image: ${PDF_BUILDER_IMAGE:-ghcr.io/ahmedrooshdii/pdf-builder:latest}
    restart: unless-stopped

    # The schema is applied on start, so the database only has to be accepting connections.
    depends_on:
      postgres:
        condition: service_healthy

    # Bound to localhost: the reverse proxy terminates TLS and is the only thing that should be
    # reachable from outside. Publishing 8080 directly would expose the API with no TLS and,
    # in a non-production environment, its docs along with it.
    ports:
      - "127.0.0.1:8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # Secrets and anything host-specific come from .env, which lives only on the VM.
      RabbitMq__ConnectionString: ${RABBITMQ_CONNECTION_STRING:?set RABBITMQ_CONNECTION_STRING in .env}
      Storage__PublicBaseUrl: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      ConnectionStrings__Database: Host=postgres;Database=pdf_builder;Username=pdf_builder;Password=${POSTGRES_PASSWORD}
      # Hash of the admin key, from `dotnet run --project tools/Blocks.Cli -- admin-key`. The key itself
      # never goes on the VM.
      Blocks__Admin__KeyHash: ${ADMIN_KEY_HASH:?set ADMIN_KEY_HASH in .env}
      # The reverse proxy's address or network, so the console's sign-in limit (5 failures a minute)
      # counts each browser apart instead of counting everyone as the proxy. Unset: loopback only.
      # Blocks__ForwardedHeaders__KnownNetworks: 172.16.0.0/12
      # How long a console sign-in lasts, from sign-in (00:05:00 to 24:00:00; default 12 hours).
      # Blocks__Console__SessionLifetime: "12:00:00"
      # The client that messages published to RabbitMQ naming none are handled for (every publisher built
      # before client ids), and the owner given, once, to templates and jobs from before clients existed.
      # Empty is fine on a fresh install. An existing deployment that has templates or jobs must set it before
      # upgrading or the service refuses to start: docs/operations.md, "Upgrading to per-client templates and jobs".
      Blocks__Bus__DefaultClientId: ${DEFAULT_CLIENT_ID:-}

      Storage__RootPath: /data/files
      TemplateStore__RootPath: /app/Templates
      # Where earlier versions kept templates written in the web app. Read once, on the first start
      # against an empty database, to import them; never written, and CI never touches it. Templates
      # now live in PostgreSQL.
      TemplateStore__AuthoredRootPath: /data/templates

      # 2 OCPU on the Always Free tier. Each concurrent render costs roughly a browser tab, and
      # rendering is CPU-bound, so going past the core count buys queueing rather than throughput.
      Playwright__MaxConcurrentRenders: "2"

    volumes:
      - pdf-data:/data
      # Templates are content, not code: editing them here takes effect on the next render,
      # with no rebuild. CI overwrites this directory on every deploy.
      - /opt/pdf-builder/templates:/app/Templates:ro

    # Chromium is the memory risk. The reservation keeps the kernel from handing the whole VM to
    # something else; the limit means a leaking browser takes down this container rather than
    # the host. Leaves room on a 12 GB box for the proxy and the OS.
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    logging:
      # Without this the JSON log file grows until the boot volume is full, which on a VM you
      # are not watching is a slow and confusing way to go down.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pdf-data:
  postgres-data:
